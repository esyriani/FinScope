[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finscope"
version = "0.0.0"
description = "A local, single-tenant personal finance web application."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
    "Flask>=3.1",
    "Flask-Login>=0.6",
    "openai>=2.33",
    "PyMySQL>=1.1",
    "SQLAlchemy>=2.0",
    "tiktoken>=0.13",
    "tzdata>=2026.2",
]

[project.optional-dependencies]
# Development tools are kept here so pyproject.toml remains the single source
# of truth for declared Python dependencies. requirements-dev.txt is only a
# pip-compatible editable-install wrapper around this extra.
dev = [
    "black>=26.5",
    "djlint>=1.39",
    "mypy>=2.1",
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8",
    "ruff>=0.15",
]

[project.scripts]
finscope = "finance_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_app = [
    "modules/categories/*.json",
    "static/**/*",
    "taxonomy.yml",
    "templates/*.html",
    "translations/*.json",
]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = '''
/(
    docs
  | runtime
  | src/finance_app/static/vendor
  | vibecoding
)/
'''

[tool.djlint]
profile = "jinja"
max_line_length = 120
ignore = "H020,H021,H023,H025,H030,H031,T003,T028"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py310"
extend-exclude = [
    ".venv",
    "docs",
    "runtime",
    "src/finance_app/static/vendor",
    "vibecoding",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = [
    "sitecustomize.py",
    "src/finance_app",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
