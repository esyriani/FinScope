[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts =
    -q
    --strict-markers
    -n auto
    -m "not optional"
norecursedirs =
    .*
    .venv
    docs
    runtime
    src
    vibecoding
filterwarnings =
    error
markers =
    unit: isolated module and helper tests with minimal application wiring
    integration: database-backed service, workflow, repository, and cross-module tests
    route: Flask route/controller tests using the test client
    smoke: high-value end-to-end workflow checks across multiple layers
    slow: tests that are expected to take longer than ordinary unit/integration tests
    optional: opt-in tests excluded from default local and pull request runs
    mysql: live MySQL runtime tests requiring FINSCOPE_TEST_MYSQL_URL
    mutation: optional mutation-testing lane for future long-running checks
    db: tests that use the application database fixtures
    flask: tests that use a Flask app, request context, or test client
