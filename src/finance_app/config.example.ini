[app]
# In production, set FINANCE_SECRET_KEY to a secure random value.
secret_key = dev-secret-key
timezone = America/Toronto
max_upload_mb = 16

[database]
# Leave url blank to derive a SQLite SQLAlchemy URL from path.
# MySQL example: url = mysql+pymysql://root@127.0.0.1:3306/finscope
url =
path = ../../runtime/finescope.db

[server]
host = 127.0.0.1
port = 5000
debug = false

[uploads]
allowed_extensions = csv

[setting_defaults]
table_page_size = 20
comparison_max_years = 2
home_top_category_limit = 5
merchant_table_limit = 10
rule_preview_limit = 10
rule_audit_transaction_limit = 5000
llm_confidence_threshold = 0.85
llm_review_threshold = 0.60
verify_threshold = 0.95
transaction_ai_rerun_enabled = true
categorization_model = gpt-4o-mini

[api_keys]
openai_api_key =
