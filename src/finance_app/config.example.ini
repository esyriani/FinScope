[app]
# In production, set FINANCE_SECRET_KEY to a secure random value.
secret_key = dev-secret-key
timezone = America/Toronto
max_upload_mb = 16
# Leave blank to use secure cookies for non-local hosts and plain cookies on loopback.
secure_cookies =

[database]
# Leave url blank to derive a SQLite SQLAlchemy URL from path.
# MySQL example: url = mysql+pymysql://root@127.0.0.1:3306/finscope
url =
path = ../../runtime/finescope.db

[server]
host = 127.0.0.1
port = 5000
debug = false

[uploads]
# Statement upload support is intentionally CSV-only for now.
allowed_extensions = csv

[setting_defaults]
theme_mode = dark
ui_language = en
table_page_size = 20
comparison_max_years = 2
comparison_insight_card_limit = 7
home_top_category_limit = 5
dashboard_top_driver_limit = 5
merchant_table_limit = 10
merchant_suggestion_limit = 5
rule_preview_limit = 10
rule_audit_transaction_limit = 5000
# Thresholds have separate meanings: review keeps a best-fit suggestion visible,
# verify clears review, and confidence creates reusable no-review rules.
# Minimum confidence for an accepted no-review AI result to create a reusable automatic rule.
llm_confidence_threshold = 0.85
# Minimum confidence for keeping an AI best-fit category as review-required instead of UNKNOWN.
llm_review_threshold = 0.60
# Minimum confidence for an accepted AI category to clear review automatically.
verify_threshold = 0.95
# Show the synchronous per-transaction Suggest category action by default.
transaction_ai_rerun_enabled = true
# Require token-estimate confirmation before AI requests by default.
confirm_ai_token_usage_enabled = true
categorization_model = gpt-4o-mini
recurrence_minimum_occurrences = 3
recurrence_date_tolerance_days = 5
recurrence_amount_tolerance_absolute = 10
recurrence_amount_tolerance_percent = 0.15
recurrence_missed_cycles_before_inactive = 2

[api_keys]
openai_api_key =
